<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voir la Lune — Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { width: max-content; margin: 0; padding: 18px; background: #090d16; color: #f4f5ef; font: 13px system-ui, sans-serif; }
      main { width: 1487px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin: 0 0 8px; color: #ddff6b; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; height: auto; border: 1px solid #343a48; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Source visuelle</figcaption>
        <img src="./reference-option-3.png" alt="Mockup de référence" />
      </figure>
      <figure>
        <figcaption>Implémentation · fixture Paris, 18 août 2026</figcaption>
        <img src="./implementation-desktop.png" alt="Capture de l’implémentation" />
      </figure>
    </main>
  </body>
</html>
